name: Rubpy Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * *'
    - cron: '30 14 * * *'
    - cron: '30 20 * * *'

jobs:
  morning:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 8 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore Session
        env:
          SESSION_DATA: ${{ secrets.RUBPY_SESSION }}
        run: echo "$SESSION_DATA" | base64 -d > hi.rp
      - run: pip install -r requirements.txt
      - run: python -u main.py

  evening:
    if: github.event.schedule == '30 14 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore Session
        env:
          SESSION_DATA: ${{ secrets.RUBPY_SESSION }}
        run: echo "$SESSION_DATA" | base64 -d > hi.rp
      - run: pip install -r requirements.txt
      - run: python -u main.py

  midnight:
    if: github.event.schedule == '30 20 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore Session
        env:
          SESSION_DATA: ${{ secrets.RUBPY_SESSION }}
        run: echo "$SESSION_DATA" | base64 -d > hi.rp
      - run: pip install -r requirements.txt
      - run: python -u main.py
